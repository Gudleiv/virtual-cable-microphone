# vcmic configuration for this machine.
#
# Filled in from `vcmic --list-devices` (see docs/devices-2026-08-12.md).
# config.example.toml has the full annotated list of every setting; only the
# device ids and anything deliberately non-default are repeated here.

[devices]

# Наушники гарнитуры (Sound Blaster GC7) - ACTIVE, Default Communications
# Device, so this is where Discord plays. Captured with WASAPI loopback.
# 48000 Hz, 2 ch, float32.
chat_render_id = "{0.0.0.00000000}.{d08ae5da-995b-4f0e-8adb-ac19ddc87bf0}"
chat_render_name = "Наушники гарнитуры (Sound Blaster GC7)"

# Микрофон (4- fifine Microphone) - ACTIVE, and the default for Console,
# Multimedia and Communications, so this is the microphone Discord uses.
# 48000 Hz, 2 ch, float32 - already stereo, no mono duplication needed.
#
# Note: "Микрофон (Sound Blaster GC7)" exists but is DISABLED in Windows, so
# the GC7's own microphone input is not an option right now.
#
# The "4-" prefix means Windows has seen this fifine on four different USB
# ports; moving it to another port mints a new endpoint id and the id below
# stops resolving. The name fallback catches that: only one fifine endpoint is
# ever ACTIVE at a time, so matching on "fifine" lands on the right one.
mic_capture_id = "{0.0.1.00000000}.{07e3bc09-e84c-412f-a7bd-290bca23d211}"
mic_capture_name = "fifine"

# CABLE-A Input (VB-Audio Virtual Cable A) - the render side of cable A.
# 48000 Hz, 2 ch, float32, minimum device period 2 ms.
#
# Do not confuse it with "CABLE-A In 16ch", which is a second render endpoint
# of the same driver. ShadowPlay must be pointed at the capture side,
# "CABLE-A Output" {0.0.1.00000000}.{a789742f-ab35-41b1-b651-1c86c68a1787}.
output_render_id = "{0.0.0.00000000}.{4367dfca-8893-49ed-80fd-c740a21c9cb9}"
output_render_name = "CABLE-A Input"

[audio]
# All three endpoints report 48000 Hz, so the strict check can stay on.
sample_rate = 48000
require_sample_rate = true

# The cable's render block measured 1056 frames = 22.0 ms on this machine, and
# the render thread takes a whole block out of each ring at once. So the real
# margin against an underrun is target_buffer_ms minus 22 ms, not the target
# itself: at 25 ms there was none left, which is what produced the underrun
# when the chat endpoint went quiet. 40 ms leaves 18 ms of margin.
#
# The better trade is to shrink the block instead: Max Latency = 512 samples in
# VBCABLE_ControlPanel.exe makes it 10.7 ms, and then 20 ms here is comfortable
# and the total added latency drops to about 31 ms.
target_buffer_ms = 40.0
ring_capacity_ms = 250.0

[mix]
# Start flat and adjust after the first test call.
chat_gain_db = 0.0
mic_gain_db = 0.0
limiter_enabled = true

[drift]
# Measured on this machine: the fifine microphone runs about +88 ppm fast
# against the cable (+87 and +88 on two independent runs, from the frame
# counters), and the GC7 render endpoint is within a few tens of ppm of it.
# 88 ppm is 317 ms per hour, so this is not optional here, and the 1000 ppm
# ceiling leaves ten times the headroom actually needed.
#
# response_s is 30 rather than the first-cut 10. The chat source, which is the
# clean one, settles inside half a minute and then wobbles by about 35 ppm,
# which is what this setting is supposed to buy. The microphone wobbles far
# more, but that is the device handing over lumps of frames roughly once a
# minute, not the loop: the log now reports the learned rate and that
# absorption separately, and only the second one moves.
enabled = true
measure_window_s = 1.0
response_s = 30.0
max_rate_correction = 0.001

[resilience]
# Defaults, kept explicit because the GC7 is a USB device: it re-enumerates on
# sleep/wake and on replug, and each stream then rebuilds itself between these
# bounds. The endpoint notifications usually make the wait irrelevant - a
# device that comes back wakes its stream in milliseconds - but the ceiling is
# what applies if a notification is missed.
backoff_min_ms = 100
backoff_max_ms = 5000

# Turned on for this machine, and this is the setting to undo first if anything
# about the headset behaves oddly.
#
# The 2026-08-13 logs showed the chat endpoint going idle whenever Discord had
# nothing to play: loopback then delivers no packets at all, not even silent
# ones, so the chat ring drained, the source dropped back to REFILLING and cost
# one underrun on the way. A silent render client of our own on that endpoint
# keeps its clock running, so loopback keeps handing over silence and none of
# that happens. What it renders is digital silence - inaudible, and the hardware
# GameVoice Mix knob is not involved either way.
keep_chat_clock_alive = true

[log]
level = "info"
file = "vcmic.log"
